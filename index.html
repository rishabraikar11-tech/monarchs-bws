<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Applications</title>
    <style>
        /* Base Styles */
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
        }

        /* Typography & Headers */
        h1 {
            text-align: center;
            font-size: 1.3rem;
            text-transform: uppercase;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }
        
        /* Buttons */
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: 700;
            font-size: 0.95rem;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            text-transform: uppercase;
            box-sizing: border-box;
        }
        .btn-discord { background-color: #5865F2; }
        .btn-telegram { background-color: #0088cc; }
        .btn-curator { background-color: #333333; }
        .btn-red { background-color: #e60000; }
        
        /* Separator */
        hr {
            border: 0;
            height: 2px;
            background-color: #e60000;
            margin: 30px 0;
        }

        /* Form Cards */
        .form-card {
            background-color: #121212;
            border-top: 3px solid #e60000;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            position: relative;
        }
        .form-card h2 {
            text-align: center;
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 1px solid #222;
            padding-bottom: 15px;
            text-transform: uppercase;
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #eeeeee;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            background-color: #050505;
            border: 1px solid #222;
            border-radius: 5px;
            color: white;
            box-sizing: border-box;
            font-family: inherit;
        }
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.85rem;
            color: #aaaaaa;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        input[type="checkbox"] {
            margin-top: 3px;
        }

        /* Closed Section Overlay */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px); /* Creates the blurred background effect */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border-radius: 0 0 8px 8px;
        }
        .overlay-text {
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Section -->
    <h1>Submitting Applications to the Community</h1>

    <a href="#" class="btn btn-discord">Discord Channel</a>
    <a href="#" class="btn btn-telegram">Telegram Channel</a>
    <a href="#" class="btn btn-curator">Application Curators</a>

    <hr>

    <a href="#" class="btn btn-red">Clan Rules</a>
    <a href="#" class="btn btn-red">Media Rules</a>

    <!-- Active Form Example -->
    <div class="form-card">
        <h2>Clan Registration</h2>
        <form>
            <div class="form-group">
                <label>1. Clan name:</label>
                <input type="text">
            </div>
            <div class="form-group">
                <label>2. Founder:</label>
                <input type="text">
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="rules-agree">
                <label for="rules-agree">I agree with the community rules and am responsible for the players.</label>
            </div>

            <button type="button" class="btn btn-red">Submit An Application</button>
        </form>
    </div>

    <!-- Closed Form Example (Blurred Overlay) -->
    <div class="form-card">
        <h2>Staff Application</h2>
        <form>
            <div class="form-group">
                <label>1. Nickname:</label>
                <input type="text" disabled>
            </div>
            <div class="form-group">
                <label>2. Experience:</label>
                <textarea rows="3" disabled></textarea>
            </div>
        </form>

        <!-- Overlay that blocks interactions -->
        <div class="overlay">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <div class="overlay-text">Reception is Closed</div>
        </div>
    </div>
</div>

</body>
</html>
